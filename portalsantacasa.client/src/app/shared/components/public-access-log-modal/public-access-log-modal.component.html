@if (isOpen) {
  <div class="access-log-overlay">
    <form class="access-log-modal" (ngSubmit)="submit()" #accessForm="ngForm">
      <button type="button" class="modal-close" aria-label="Fechar" (click)="close()">
        <i class="fas fa-times"></i>
      </button>
      <div class="modal-icon">
        <i class="fas fa-clipboard-list"></i>
      </div>
      <span class="modal-eyebrow">Registro obrigatório</span>
      <h2>Acesso a {{ page }}</h2>
      <p>Selecione seu vínculo e informe sua identificação para registrar o acesso.</p>
      <fieldset class="employment-options" [disabled]="isSubmitting">
        <legend>Vínculo</legend>
        <label><input type="radio" name="employmentType" value="CLT" [(ngModel)]="employmentType" (ngModelChange)="onEmploymentTypeChange()" required> CLT</label>
        <label><input type="radio" name="employmentType" value="PJ" [(ngModel)]="employmentType" (ngModelChange)="onEmploymentTypeChange()" required> PJ</label>
      </fieldset>
      @if (employmentType) {
      <label>
        {{ identifierLabel }}
        <input type="text" name="re" [(ngModel)]="form.re"
          (ngModelChange)="onChapaChange()" (blur)="lookupEmployee()"
          [disabled]="isSubmitting" [maxlength]="employmentType === 'PJ' ? 14 : 50" required
          inputmode="numeric" autocomplete="off">
      </label>
      @if (isLookingUp) {
        <p role="status" aria-live="polite">Consultando cadastro...</p>
      }
      <label>
        Nome
        <input type="text" name="name" [(ngModel)]="form.name" [readonly]="!manualEntry" [disabled]="isSubmitting" maxlength="160" required>
      </label>
      <label>
        Setor
        <input type="text" name="sector" [(ngModel)]="form.sector" [readonly]="!manualEntry" [disabled]="isSubmitting" maxlength="160" required>
      </label>
      }
      @if (errorMessage) {
        <div class="error-message" role="alert">
          {{ errorMessage }}
        </div>
      }
      <button type="submit" [disabled]="!employmentType || accessForm.invalid || isSubmitting || isLookingUp || (!employeeFound && !manualEntry)">
        <span>{{ isSubmitting ? 'Registrando...' : 'Registrar acesso' }}</span>
      </button>
    </form>
  </div>
}

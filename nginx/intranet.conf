server {
    listen 80;
    server_name intranet.santacasalorena.org.br;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name intranet.santacasalorena.org.br;

    ssl_certificate /etc/letsencrypt/live/intranet.santacasalorena.org.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranet.santacasalorena.org.br/privkey.pem;

    client_max_body_size 600M;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /realtime/ {
        proxy_pass http://realtime:8080/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}

# Relatórios is enabled on the host only after its certificate is ready.
include /etc/nginx/relatorios/enabled/*.conf;

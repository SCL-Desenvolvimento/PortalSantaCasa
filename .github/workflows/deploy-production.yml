name: CD — Produção

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build de produção
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build-validation.yml

  # ============================================================
  # CD / PRODUÇÃO
  # Executado SOMENTE no docker-w3
  # ============================================================

  deploy:
    name: Deploy produção
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    needs:
      - build

    runs-on:
      - self-hosted
      - Linux
      - X64
      - production

    environment:
      name: production

    steps:

      - name: Checkout da infraestrutura
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # --------------------------------------------------------
      # INFORMAÇÕES
      # --------------------------------------------------------

      - name: Informações do deploy
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Deploy: ${{ vars.DEPLOY_PATH }}"
          echo "Runner: $RUNNER_NAME"

      # --------------------------------------------------------
      # VALIDAÇÕES
      # --------------------------------------------------------

      - name: Validar diretório de produção
        run: |
          if [ -z "${{ vars.DEPLOY_PATH }}" ]; then
            echo "DEPLOY_PATH não configurado."
            exit 1
          fi

          if [ ! -d "${{ vars.DEPLOY_PATH }}" ]; then
            echo "Diretório não encontrado:"
            echo "${{ vars.DEPLOY_PATH }}"
            exit 1
          fi

          if [ ! -f "${{ vars.DEPLOY_PATH }}/docker-compose.yml" ]; then
            echo "docker-compose.yml não encontrado."
            exit 1
          fi

          if [ ! -f "${{ vars.DEPLOY_PATH }}/Dockerfile" ]; then
            echo "Dockerfile não encontrado."
            exit 1
          fi

          if [ ! -f "${{ vars.DEPLOY_PATH }}/Dockerfile.realtime" ]; then
            echo "Dockerfile.realtime não encontrado."
            exit 1
          fi

      - name: Validar ferramentas
        run: |
          command -v docker >/dev/null 2>&1 || {
            echo "Docker não encontrado."
            exit 1
          }

          command -v rsync >/dev/null 2>&1 || {
            echo "rsync não encontrado."
            exit 1
          }

          docker compose version
          rsync --version | head -1
          /usr/local/sbin/scl-https-gateway check

      - name: Sincronizar infraestrutura versionada
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: bash .github/scripts/sync-infrastructure.sh "$GITHUB_WORKSPACE" "$DEPLOY_PATH"

      # --------------------------------------------------------
      # BAIXAR PUBLISH GERADO PELO CI
      # --------------------------------------------------------

      - name: Baixar Publish Server
        uses: actions/download-artifact@v8
        with:
          name: publish-server
          path: ${{ runner.temp }}/publish-server

      - name: Baixar Publish Realtime
        uses: actions/download-artifact@v8
        with:
          name: publish-realtime
          path: ${{ runner.temp }}/publish-realtime

      # --------------------------------------------------------
      # VALIDAR ARTIFACTS
      # --------------------------------------------------------

      - name: Validar arquivos publicados
        run: |
          test -f "${{ runner.temp }}/publish-server/PortalSantaCasa.Server.dll"
          test -f "${{ runner.temp }}/publish-realtime/PortalSantaCasa.Realtime.dll"

          echo "Server:"
          ls -lah "${{ runner.temp }}/publish-server" | head -30

          echo ""
          echo "Realtime:"
          ls -lah "${{ runner.temp }}/publish-realtime" | head -30

      # --------------------------------------------------------
      # GARANTIR DIRETÓRIOS
      # --------------------------------------------------------

      - name: Preparar diretórios de produção
        run: |
          mkdir -p "${{ vars.DEPLOY_PATH }}/app"
          mkdir -p "${{ vars.DEPLOY_PATH }}/realtime"
          mkdir -p "${{ vars.DEPLOY_PATH }}/app/Uploads"

      # --------------------------------------------------------
      # PUBLICAR SERVER
      #
      # IMPORTANTE:
      # Uploads NÃO será apagado.
      # --------------------------------------------------------

      - name: Publicar Server
        run: |
          echo "Publicando PortalSantaCasa.Server..."

          rsync -rltD \
            --delete \
            --exclude='Uploads/' \
            --exclude='appsettings.*.local.json' \
            "${{ runner.temp }}/publish-server/" \
            "${{ vars.DEPLOY_PATH }}/app/"

      # --------------------------------------------------------
      # PUBLICAR REALTIME
      # --------------------------------------------------------

      - name: Publicar Realtime
        run: |
          echo "Publicando PortalSantaCasa.Realtime..."

          rsync -rltD \
            --delete \
            --exclude='appsettings.*.local.json' \
            "${{ runner.temp }}/publish-realtime/" \
            "${{ vars.DEPLOY_PATH }}/realtime/"

      # --------------------------------------------------------
      # VALIDAÇÃO ANTES DO DOCKER
      # --------------------------------------------------------

      - name: Validar arquivos em produção
        run: |
          if [ ! -f "${{ vars.DEPLOY_PATH }}/app/PortalSantaCasa.Server.dll" ]; then
            echo "PortalSantaCasa.Server.dll não encontrado."
            exit 1
          fi

          if [ ! -f "${{ vars.DEPLOY_PATH }}/realtime/PortalSantaCasa.Realtime.dll" ]; then
            echo "PortalSantaCasa.Realtime.dll não encontrado."
            exit 1
          fi

          echo "Server publicado corretamente."
          echo "Realtime publicado corretamente."

      # --------------------------------------------------------
      # DOCKER COMPOSE
      # --------------------------------------------------------

      - name: Validar Docker Compose
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker compose config --quiet

      # --------------------------------------------------------
      # BUILD SOMENTE APP E REALTIME
      # Banco/RabbitMQ/Redis não são rebuildados
      # --------------------------------------------------------

      - name: Build das imagens
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker compose build app realtime

      - name: Validar runtime .NET das imagens
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          for service in app realtime; do
            runtimes=$(docker compose run --rm --no-deps --entrypoint dotnet "$service" --list-runtimes)
            echo "$runtimes"
            if ! echo "$runtimes" | grep -q '^Microsoft.AspNetCore.App 10\.'; then
              echo "A imagem de $service precisa do ASP.NET Core 10. Atualize o Dockerfile antes do deploy."
              exit 1
            fi
          done

      # --------------------------------------------------------
      # APLICAR CONFIGURAÇÃO DA INFRAESTRUTURA E PUBLICAR APP E REALTIME
      # --------------------------------------------------------

      - name: Publicar containers
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker compose up -d --no-deps mysql80 rabbitmq redis
          docker compose up -d --no-deps app realtime

      # --------------------------------------------------------
      # VERIFICAÇÃO
      # --------------------------------------------------------

      - name: Aguardar containers
        run: sleep 10

      - name: Verificar containers
        working-directory: ${{ vars.DEPLOY_PATH }}
        run: |
          docker compose ps app realtime

          if [ "$(docker inspect -f '{{.State.Running}}' fe-intranet-sp-santacasalorena-org-br)" != "true" ]; then
            echo "Container principal não está executando."
            docker logs --tail 100 fe-intranet-sp-santacasalorena-org-br
            exit 1
          fi

          if [ "$(docker inspect -f '{{.State.Running}}' realtime-intranet-sp-santacasalorena-org-br)" != "true" ]; then
            echo "Container Realtime não está executando."
            docker logs --tail 100 realtime-intranet-sp-santacasalorena-org-br
            exit 1
          fi

      # --------------------------------------------------------
      # LOGS
      # --------------------------------------------------------

      - name: Últimos logs
        run: |
          echo "========== APP =========="
          docker logs --tail 30 fe-intranet-sp-santacasalorena-org-br || true

          echo ""
          echo "========== REALTIME =========="
          docker logs --tail 30 realtime-intranet-sp-santacasalorena-org-br || true

      - name: Verificar HTTP dos backends e publicar site
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker exec scl-https-gateway python3 -c 'import http.client; c=http.client.HTTPConnection("scl-intranet", 8080, timeout=5); c.request("GET", "/", headers={"X-Forwarded-Proto":"https"}); r=c.getresponse(); assert r.status == 200, r.status; r.read(1); c.close()'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          docker exec scl-https-gateway python3 -c 'import socket; socket.create_connection(("scl-intranet-realtime", 8080), timeout=5).close()'
          /usr/local/sbin/scl-https-gateway publish --repository "$GITHUB_REPOSITORY" --file "$DEPLOY_PATH/gateway/site.json"

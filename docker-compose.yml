services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fe-intranet-sp-santacasalorena-org-br
    restart: always

    expose:
      - "8080"

    env_file:
      - .gateway.env

    depends_on:
      - mysql80
      - rabbitmq
      - realtime

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}

      ConnectionStrings__PortalSclConnectionString: ${PORTAL_SCL_CONNECTION_STRING:?PORTAL_SCL_CONNECTION_STRING is required}
      ConnectionStrings__RhConnectionString: ${RH_CONNECTION_STRING:?RH_CONNECTION_STRING is required}

      ConnectionStrings__OraclePjConnectionString: ${ORACLE_PJ_CONNECTION_STRING:?ORACLE_PJ_CONNECTION_STRING is required}

      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__UseSsl: "false"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

      TacticalRmm__BaseUrl: ${TacticalRmm__BaseUrl:?TacticalRmm__BaseUrl is required}
      TacticalRmm__ApiKey: ${TacticalRmm__ApiKey:?TacticalRmm__ApiKey is required}

    volumes:
      - /home/santacasalorena-org-br/intranet/docker/app/Uploads:/app/Uploads

    networks:
      rede_intranet:
      https_gateway:
        aliases:
          - scl-intranet


  realtime:
    build:
      context: .
      dockerfile: Dockerfile.realtime

    container_name: realtime-intranet-sp-santacasalorena-org-br
    restart: always

    expose:
      - "8080"

    depends_on:
      - rabbitmq
      - redis

    env_file:
      - .gateway.env

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}

      ConnectionStrings__Redis: ${REDIS_CONNECTION_STRING:?REDIS_CONNECTION_STRING is required}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__UseSsl: "false"
      RabbitMQ__User: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    networks:
      rede_intranet:
      https_gateway:
        aliases:
          - scl-intranet-realtime


  mysql80:
    image: mysql:8.0

    container_name: db-intranet-sp-santacasalorena-org-br
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data_intranet:/var/lib/mysql

    networks:
      - rede_intranet


  rabbitmq:
    image: rabbitmq:3-management

    container_name: rabbitmq-intranet
    restart: always

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data_intranet:/var/lib/rabbitmq

    networks:
      - rede_intranet


  redis:
    image: redis:7

    container_name: redis-intranet
    restart: always

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data_intranet:/data

    networks:
      - rede_intranet


volumes:
  mysql_data_intranet:
  rabbitmq_data_intranet:
  redis_data_intranet:


networks:
  rede_intranet:
    driver: bridge

  https_gateway:
    external: true
    name: scl-https-proxy
